# LectoForge Issue 标签定义
# ---------------------------------------------------------------------------
# 本文件是标签的机器可读定义，供 label-sync 类工具（如 crazy-max/ghaction-
# github-labeler、EndBug/label-sync）批量创建 / 更新仓库标签。
#
# 标签体系说明（四个正交维度 + 若干特殊标签）见同目录的 labels.md。
#
# 注意：
#   1. color 为 6 位十六进制，不带 `#`；
#   2. 同步工具默认会「删除未在此文件中列出的标签」——首次同步前请确认，
#      以免误删 GitHub 的默认标签（若需保留，请在此文件补齐或在工具中配置保留）；
#   3. Gitee 的标签体系与 GitHub 不通用，需在「管理 → 标签管理」手工创建，
#      可对照本文件的名称与颜色。

# ============================ 类型 type: ============================

- name: "type: bug"
  color: "d73a4a"
  description: "功能与预期不符，属于缺陷"

- name: "type: feature"
  color: "0e8a16"
  description: "现在没有的新能力"

- name: "type: enhancement"
  color: "1d76db"
  description: "能力已有，但不够好用或不够完整"

- name: "type: refactor"
  color: "5319e7"
  description: "重构，行为不应改变"

- name: "type: perf"
  color: "fbca04"
  description: "性能优化"

- name: "type: docs"
  color: "0075ca"
  description: "文档相关"

- name: "type: chore"
  color: "cfd3d7"
  description: "杂项：依赖升级、脚本、配置"

- name: "type: question"
  color: "d876e3"
  description: "使用疑问或咨询"

# ============================ 模块 area: ============================

- name: "area: inbox"
  color: "c5def5"
  description: "收集箱、剪藏、语音/截图录入、待处理整理"

- name: "area: notes"
  color: "c5def5"
  description: "康奈尔笔记、双链与反链、笔记 AI 能力、笔记导出"

- name: "area: memory"
  color: "c5def5"
  description: "记忆宫殿、地点、主动回忆"

- name: "area: review"
  color: "c5def5"
  description: "间隔重复、SM-2 算法、闪卡、遗忘曲线与热力图"

- name: "area: library"
  color: "c5def5"
  description: "文档库（本地 Markdown 工作台）、vault、资源与待办扫描"

- name: "area: mindmap"
  color: "c5def5"
  description: "思维导图三视图、markmap 渲染、大纲编辑"

- name: "area: diagram"
  color: "c5def5"
  description: "绘图工具白板、形状库、连线、导出"

- name: "area: tasks"
  color: "c5def5"
  description: "任务清单、智能列表、清单树、子任务"

- name: "area: calendar"
  color: "c5def5"
  description: "日历视图、四象限、日期与节假日"

- name: "area: habits"
  color: "c5def5"
  description: "习惯打卡、连续天数、热力图"

- name: "area: pomodoro"
  color: "c5def5"
  description: "番茄钟计时引擎、白噪音、提示音、统计"

- name: "area: ai"
  color: "c5def5"
  description: "AI 助手、知识库问答（RAG）、学习日报、LLM provider"

- name: "area: voice"
  color: "c5def5"
  description: "离线语音（Whisper STT / Piper TTS）、OCR、模拟面试"

- name: "area: settings"
  color: "c5def5"
  description: "设置中心、备份、配置与数据目录、新手引导"

- name: "area: tauri"
  color: "c5def5"
  description: "桌面外壳、窗口、托盘、通知、自动更新、侧车托管"

- name: "area: build"
  color: "c5def5"
  description: "构建脚本、打包配置、CI、发布流程"

- name: "area: ui"
  color: "c5def5"
  description: "设计令牌、主题（明/暗、强调色）、全局组件与布局"

# ========================== 优先级 priority: ==========================

- name: "priority: P0"
  color: "b60205"
  description: "阻断：数据丢失 / 无法启动 / 崩溃 / 安全漏洞。立即处理"

- name: "priority: P1"
  color: "d93f0b"
  description: "高：核心流程不可用，且无绕过方案。优先于新功能"

- name: "priority: P2"
  color: "fbca04"
  description: "中：影响体验，但存在可接受的绕过方案。按正常排期"

- name: "priority: P3"
  color: "c2e0c6"
  description: "低：打磨类（文案、间距、边缘场景）。有余力时处理"

# ============================ 状态 status: ============================

- name: "status: needs-triage"
  color: "e99695"
  description: "刚提交，尚未分类"

- name: "status: needs-info"
  color: "fef2c0"
  description: "信息不足，等待提问者补充（环境信息 / 复现步骤）"

- name: "status: confirmed"
  color: "0e8a16"
  description: "已确认成立，等待排期"

- name: "status: in-progress"
  color: "1d76db"
  description: "正在处理"

- name: "status: blocked"
  color: "b60205"
  description: "被外部依赖或前置决策阻塞"

- name: "status: wontfix"
  color: "ffffff"
  description: "明确不计划修复，理由见 Issue 正文"

- name: "status: duplicate"
  color: "cfd3d7"
  description: "与已有 Issue 重复，已附原 Issue 链接"

# ============================ 其他标签 ============================

- name: "good first issue"
  color: "7057ff"
  description: "适合首次贡献者，改动范围小且有明确指引"

- name: "help wanted"
  color: "008672"
  description: "欢迎社区认领，维护者已给出方向"

- name: "breaking change"
  color: "b60205"
  description: "会破坏向后兼容（数据格式 / 配置项 / 行为语义）"

- name: "security"
  color: "ee0701"
  description: "安全问题。若涉及可利用漏洞，请勿公开讨论细节"

- name: "dependencies"
  color: "0366d6"
  description: "依赖升级类改动"
