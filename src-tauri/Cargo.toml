[package]
name = "lectoforge-desktop"
version = "1.0.0"
description = "LectoForge 学习工作台桌面应用"
authors = ["LectoForge"]
edition = "2021"

[lib]
name = "lectoforge_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# 系统原生「选择文件夹」弹窗，供引导页 / 设置中心的数据目录选择使用
tauri-plugin-dialog = "2"
# 数据备份：前端用 fs 插件列出 / 创建备份目录
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 纯 Rust HTTP 客户端，用于后台轮询待复习计数（无 OpenSSL 依赖，macOS 开箱即用）
ureq = { version = "2", features = ["json"] }
# 每日备份调度器：tokio 异步 sleep（与 Tauri 内部运行时同源，零额外体积）
tokio = { version = "1", features = ["time"] }
# 解析「每日触发时刻」所需的本地时间计算
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# 默认启用自定义协议（生产构建需要）
custom-protocol = ["tauri/custom-protocol"]
