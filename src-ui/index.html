<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LectoForge 学习工作台</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { background: #F7F8FA; }
      #lf-boot {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #6B7280;
      }
      #lf-boot .lf-spin {
        width: 26px; height: 26px; border-radius: 50%;
        border: 2px solid rgba(59, 111, 224, 0.18);
        border-top-color: #3B6FE0;
        animation: lf-rotate 0.7s linear infinite;
      }
      @keyframes lf-rotate { to { transform: rotate(360deg); } }
      #lf-boot .lf-tip { font-size: 13px; }
      #lf-fatal {
        display: none; position: absolute; inset: 0; z-index: 10;
        padding: 32px; overflow: auto; background: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; line-height: 1.7; color: #B42318; white-space: pre-wrap;
      }
      #lf-fatal h2 {
        margin: 0 0 12px; font-size: 14px; font-weight: 500; color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="lf-boot">
        <div class="lf-spin"></div>
        <div class="lf-tip">正在启动 LectoForge…</div>
      </div>
    </div>

    <div id="lf-fatal"></div>

    <script>
      /* 启动失败诊断兜底。
       * 模块脚本若因 MIME 不符（例如静态资源 404 被回落成 HTML）被浏览器拒绝执行，
       * 是不会抛出可见错误的，页面只会一直停在加载态。这里做超时兜底，把线索显示出来，
       * 避免只能对着一个转圈干瞪眼。 */
      (function () {
        var fatal = document.getElementById('lf-fatal');
        var lines = [];
        var shown = false;

        function render(title) {
          if (!fatal) return;
          shown = true;
          fatal.style.display = 'block';
          fatal.innerHTML = '<h2>' + title + '</h2>';
          fatal.appendChild(document.createTextNode(lines.join('\n')));
        }

        function push(msg) {
          lines.push(msg);
          if (shown) render('界面启动失败');
        }

        window.addEventListener('error', function (e) {
          // 资源加载失败（图片 / 字体 / 样式等）：只记录，绝不弹「界面启动失败」遮罩。
          // 否则任意一张图 404 都会把整个工作台判死（尤其是文档库里 ![[图片]] 在
          // findAsset 纠正 src 之前会先 404 一次，属于正常时序，不是致命错误）。
          var t = e.target
          if (t && t.tagName && t.tagName !== 'SCRIPT') {
            console.warn('[boot] 资源加载失败:', (t.src || t.href || t.currentSrc || '(unknown)'))
            return
          }
          // 若 Vue 已经接管页面（启动遮罩 #lf-boot 已被移除），说明界面已正常启动，
          // 运行期错误交给应用自身的错误边界 / 控制台，不再覆盖为「启动失败」。
          if (!document.getElementById('lf-boot')) {
            console.error('[runtime error]', e.message, e.filename, e.lineno)
            return
          }
          if (t && t.tagName === 'SCRIPT') {
            push('资源加载失败: ' + (t.src || '(inline)'));
          } else {
            push('ERROR: ' + (e.message || '(未知错误)') + ' @ ' + (e.filename || '') + ':' + (e.lineno ?? ''));
          }
          render('界面启动失败');
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          // 应用启动完成后再无「启动失败」的概念；未接管的 Promise 拒绝只记控制台。
          if (!document.getElementById('lf-boot')) {
            console.error('[unhandled rejection]', e.reason)
            return
          }
          push('UNHANDLED: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
          render('界面启动失败');
        });

        setTimeout(function () {
          if (!document.getElementById('lf-boot')) return;
          push('等待 10 秒后 Vue 仍未接管页面。');
          push('通常意味着 /assets 下的脚本没能正确返回（被回落成 HTML 会导致模块脚本被静默拒绝）。');
          push('请确认没有上一次未退出的后端进程占用端口，然后重启应用。');
          render('界面启动超时');
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
